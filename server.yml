---
- name: Configure the server and install required software
  hosts: vpn-host
  gather_facts: false
  become: true
  vars_files:
    - config.cfg
  tasks:
    - block:
        - name: Wait until the cloud-init completed
          wait_for:
            path: /var/lib/cloud/data/result.json
            delay: 10         # Conservative 10 second initial delay
            timeout: 480      # Reduce from 600 to 480 seconds (8 minutes)
            sleep: 10         # Check every 10 seconds (less aggressive)
            state: present
          become: false
          when: cloudinit | bool

        - when: inventory_hostname != 'localhost'
          become: false
          delegate_to: localhost
          block:
            - name: Ensure the config directory exists
              file:
                dest: configs/{{ IP_subject_alt_name }}
                state: directory
                mode: "0700"

        - import_role:
            name: common
          tags: common

        - import_role: {name: dns}
          when: algo_dns_adblocking | bool or dns_encryption | bool
          tags: dns

        - import_role: {name: wireguard}
          tags: wireguard

        - import_role:
            name: privacy
          when: privacy_enhancements_enabled | default(true)
          tags: privacy

        - name: Point the endpoint hostname at this server
          include_tasks:
            file: playbooks/cloudflare-dns.yml
            apply:
              delegate_to: localhost
              become: false
          vars:
            dns_target_ip: "{{ IP_subject_alt_name }}"
            dns_project_ips: "{{ hostvars['localhost'].project_server_ips | default(none) }}"
          when:
            - endpoint_hostname | default('') | length > 0
            - cloudflare_api_token | default('') | length > 0

        - tags: always
          block:
            - debug:
                msg:
                  - "{{ congrats.common.split('\n') }}"
      rescue:
        - include_tasks: playbooks/rescue.yml
