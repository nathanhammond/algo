---
- name: Set subjectAltName as a fact
  set_fact:
    IP_subject_alt_name: "{{ (IP_subject_alt_name if algo_provider == 'local' else cloud_instance_ip) | lower }}"

- name: Ensure the config directory exists
  file:
    path: configs/{{ IP_subject_alt_name }}
    state: directory
    mode: "0700"
  when: cloud_instance_ip != 'localhost'

- name: Look for the server's saved SSH host key
  stat:
    path: configs/{{ IP_subject_alt_name }}/known_hosts
  register: _known_hosts

# New DreamCompute servers have their key saved before they boot. Otherwise
# (provider: local, or a server deployed before keys were saved) the first
# connection trusts the key it is shown and saves it; later ones must match.
- name: Note that the server's SSH host key is not known yet
  debug:
    msg: >-
      No SSH host key is saved for {{ IP_subject_alt_name }}, so this run trusts the key the server
      presents and saves it to configs/{{ IP_subject_alt_name }}/known_hosts. Later runs must match it.
  when:
    - cloud_instance_ip != 'localhost'
    - not _known_hosts.stat.exists

- name: Add the server to an inventory group
  add_host:
    name: "{% if cloud_instance_ip == 'localhost' %}localhost{% else %}{{ cloud_instance_ip }}{% endif %}"
    groups: vpn-host
    ansible_connection: "{% if cloud_instance_ip == 'localhost' %}local{% else %}ssh{% endif %}"
    ansible_ssh_user: "{{ ansible_ssh_user | default('root') }}"
    ansible_ssh_port: "{{ ansible_ssh_port | default(22) }}"
    ansible_python_interpreter: "{% if cloud_instance_ip == 'localhost' %}{{ ansible_playbook_python }}{% else %}/usr/bin/python3{% endif %}"
    algo_provider: "{{ algo_provider }}"
    algo_server_name: "{{ algo_server_name }}"
    IP_subject_alt_name: "{{ IP_subject_alt_name }}"
    cloudinit: "{{ cloudinit | default(false) }}"
    ansible_ssh_common_args: >-
      -o UserKnownHostsFile={{ playbook_dir }}/configs/{{ IP_subject_alt_name }}/known_hosts
      -o StrictHostKeyChecking={{ 'yes' if _known_hosts.stat.exists else 'accept-new' }}

- name: Additional variables for the server
  add_host:
    name: "{% if cloud_instance_ip == 'localhost' %}localhost{% else %}{{ cloud_instance_ip }}{% endif %}"
    ansible_ssh_private_key_file: "{{ playbook_dir }}/{{ SSH_keys.private }}"
  when: algo_provider != 'local'

# cloud-init installs every pending update before it moves SSH to ssh_port,
# which took nearly five minutes on a new Ubuntu 26.04 server.
- name: Wait until SSH becomes ready...
  wait_for:
    port: "{{ ansible_ssh_port | default(22) }}"
    host: "{{ cloud_instance_ip }}"
    search_regex: OpenSSH
    delay: 10
    timeout: 900
    state: present
  when: cloud_instance_ip != "localhost"

- debug:
    var: IP_subject_alt_name

- name: Wait for target connection to become reachable/usable
  wait_for_connection:
    delay: 10         # Wait 10 seconds before first attempt (conservative)
    timeout: 480      # Reduce from 600 to 480 seconds (8 minutes - safer)
    sleep: 10         # Check every 10 seconds (less aggressive polling)
  delegate_to: "{{ item }}"
  loop: "{{ groups['vpn-host'] }}"
  when: cloud_instance_ip != "localhost"
