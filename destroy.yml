---
- name: Destroy the DreamCompute server
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    - config.cfg
  vars:
    # Same name the server was created with (see input.yml)
    algo_server_name: "{{ server_name | default('algo') | regex_replace('(?!\\.)(\\W|_)', '-') }}"

  tasks:
    - block:
        # Deleting the server must never leave endpoint_hostname pointing at nothing
        - name: Verify the endpoint hostname's A record can be removed
          assert:
            that: cloudflare_api_token | default('') | length > 0
            msg: >-
              endpoint_hostname is set to {{ endpoint_hostname }}, so destroy must remove its A record
              before deleting the server, and that needs a Cloudflare API token. Run:
              export CLOUDFLARE_API_TOKEN=<your Cloudflare API token>
          when: endpoint_hostname | default('') | length > 0

        - name: Display destroy plan
          debug:
            msg: >-
              Deleting the server '{{ algo_server_name }}' and its security group{{
              ', and the A record for ' + endpoint_hostname + ' if it points at the server'
              if endpoint_hostname | default('') | length > 0 else '' }}.
              Local configs are kept.

        - name: Confirm destruction
          pause:
            prompt: |
              This permanently destroys the server '{{ algo_server_name }}'.
              Type 'yes' to confirm
          register: _confirm_destroy
          when: not confirm_destroy | default(false) | bool

        - name: Abort if not confirmed
          fail:
            msg: "Destroy aborted. To skip the prompt run: ./algo destroy -e confirm_destroy=true"
          when:
            - not confirm_destroy | default(false) | bool
            - _confirm_destroy.user_input | default('') | lower != 'yes'

        - name: Destroy cloud resources
          include_tasks: roles/cloud-openstack/tasks/destroy.yml
      rescue:
        - include_tasks: playbooks/rescue.yml
