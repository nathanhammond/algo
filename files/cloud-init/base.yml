#cloud-config
# CRITICAL: The above line MUST be exactly "#cloud-config" (no space after #)
# This is required by cloud-init's YAML parser. Adding a space breaks parsing
# and causes all cloud-init directives to be skipped, resulting in SSH timeouts.
# See: https://github.com/trailofbits/algo/issues/14800
output: {all: '| tee -a /var/log/cloud-init-output.log'}

package_update: true
package_upgrade: true

packages:
  - sudo

users:
  - default
  - name: algo
    homedir: /home/algo
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: adm,netdev
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "{{ lookup('file', SSH_keys.public) | string }}"

# The server makes its own SSH host key, so the private half never leaves it:
# the image's keys are deleted and only an ed25519 key is generated.
ssh_deletekeys: true
ssh_genkeytypes: [ed25519]

write_files:
  - path: /etc/ssh/sshd_config
    content: |
{{ lookup('template', 'files/cloud-init/sshd_config') | string | indent(width=6, first=True) }}

runcmd:
  # The deploy reads the host key from the console log through the OpenStack API,
  # so its first connection can verify the server. This writes it as one line with
  # a fixed prefix, straight to the console (ttyS0 is what the API returns).
  - printf 'ALGO-SSH-HOST-KEY %s\n' "$(cut -d ' ' -f 1,2 /etc/ssh/ssh_host_ed25519_key.pub)" > /dev/console
  - set -x
  - ufw --force reset
  - sudo apt-get remove -y --purge sshguard || true
  # Ubuntu 24.04 and later start sshd from ssh.socket, which only picks up the new
  # Port from sshd_config after systemd generators re-run.
  - systemctl daemon-reload
  - if systemctl is-enabled --quiet ssh.socket; then systemctl restart ssh.socket; fi
  - systemctl restart ssh.service
