---
- name: Algo VPN Setup
  hosts: localhost
  become: false
  vars_files:
    - config.cfg
  tasks:
    - name: Playbook dir stat
      stat:
        path: "{{ playbook_dir }}"
      register: _playbook_dir

    - name: Ensure Ansible is not being run in a world writable directory
      assert:
        that: _playbook_dir.stat.mode|int <= 775
        msg: >
          Ansible is being run in a world writable directory ({{ playbook_dir }}), ignoring it as an ansible.cfg source.
          For more information see https://docs.ansible.com/ansible/devel/reference_appendices/config.html#cfg-in-world-writable-dir

    - name: Ensure the requirements installed
      debug:
        msg: "{{ '192.168.1.1' | ansible.utils.ipaddr }}"
      failed_when: false
      no_log: true
      register: ipaddr

    - name: Extract ansible version from pyproject.toml
      set_fact:
        ansible_requirement: "{{ lookup('file', 'pyproject.toml') | regex_search('ansible==[0-9]+\\.[0-9]+\\.[0-9]+') }}"

    - name: Parse ansible version requirement
      set_fact:
        required_ansible_version:
          op: "{{ ansible_requirement | regex_replace('^ansible\\s*([~>=<]+)\\s*.*$', '\\1') }}"
          ver: "{{ ansible_requirement | regex_replace('^ansible\\s*[~>=<]+\\s*(\\d+\\.\\d+(?:\\.\\d+)?).*$', '\\1') }}"
      when: ansible_requirement is defined

    - name: Get current ansible package version
      command: uv pip list
      register: uv_package_list
      changed_when: false

    - name: Extract ansible version from uv package list
      set_fact:
        current_ansible_version: "{{ uv_package_list.stdout | regex_search('ansible\\s+([0-9]+\\.[0-9]+\\.[0-9]+)', '\\1') | first }}"

    - name: Verify Python meets Algo VPN requirements
      assert:
        that: (ansible_facts['python'].version.major|string + '.' + ansible_facts['python'].version.minor|string) is version('3.12', '>=')
        msg: >
          Python version is not supported.
          You must upgrade to at least Python 3.12 to use this version of Algo.
          See for more details - https://trailofbits.github.io/algo/troubleshooting.html#python-version-is-not-supported

    - name: Verify Ansible meets Algo VPN requirements
      assert:
        that:
          - current_ansible_version is version(required_ansible_version.ver, required_ansible_version.op)
          - not ipaddr.failed
        msg: >
          Ansible version is {{ current_ansible_version }}.
          You must update the requirements to use this version of Algo.
          Try to run: uv sync

    # Each name becomes a file name under configs/, beside the server's own key,
    # which is named after its IP address.
    - name: Verify the user names
      assert:
        that:
          - users | length > 0
          - users | map('string') | unique | length == users | length
          - users | map('string') | reject('match', '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') | list | length == 0
          - users | map('string') | select('ansible.utils.ip_address') | list | length == 0
        msg: >-
          users in config.cfg must be a list of unique names, each up to 64 letters, digits, '.', '_' or '-'
          starting with a letter or digit, and none may be an IP address.

    - name: Verify dns_force_dnscrypt has a resolver to send DNS to
      assert:
        that: dns_encryption | bool or not dns_force_dnscrypt | default(false) | bool
        msg: "dns_force_dnscrypt needs dns_encryption: true in config.cfg, or set dns_force_dnscrypt: false"

    - name: Verify the custom DNS records
      assert:
        that: (dns_records | default({})).values() | reject('ansible.utils.ip_address') | list | length == 0
        msg: "Every value under dns_records in config.cfg must be an IPv4 or IPv6 address"

    - name: Verify the endpoint hostname
      assert:
        that: >-
          endpoint_hostname | default('') | length == 0 or
          endpoint_hostname is match('^(?=.{1,253}$)([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]{2,63}$')
        msg: "endpoint_hostname in config.cfg must be a DNS name such as vpn.example.com, or empty"

    - name: Verify the Cloudflare token can manage the endpoint hostname
      include_tasks: playbooks/cloudflare-dns.yml
      vars:
        dns_check_only: true
      when:
        - endpoint_hostname | default('') | length > 0
        - cloudflare_api_token | default('') | length > 0

    - name: Check for the WireGuard tools
      command: wg --version
      register: _wg_version
      changed_when: false
      failed_when: false

    - name: Verify the WireGuard tools are installed
      assert:
        that: _wg_version.rc == 0
        msg: >
          The wg command is needed to create WireGuard keys on this computer.
          Install it with: brew install wireguard-tools (macOS) or sudo apt install wireguard-tools (Ubuntu)

- name: Include prompts playbook
  import_playbook: input.yml

- name: Include cloud provisioning playbook
  import_playbook: cloud.yml

- name: Include server configuration playbook
  import_playbook: server.yml
