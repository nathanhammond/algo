[defaults]
inject_facts_as_vars = False
inventory = inventory
pipelining = True
retry_files_enabled = False
# Host keys are checked against configs/<ip>/known_hosts (see playbooks/cloud-post.yml)
host_key_checking = True
timeout = 60
stdout_callback = default
display_skipped_hosts = no
force_valid_group_names = ignore
remote_tmp = /tmp/.ansible/tmp
# Use only the collections bundled with the ansible package in .venv, which
# uv.lock pins with hashes. Empty means this directory, which has none; the
# default (~/.ansible/collections) would take precedence over the locked ones.
collections_path =

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=6 -o ConnectionAttempts=30 -o IdentitiesOnly=yes
scp_if_ssh = True
retries = 30
