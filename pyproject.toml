[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "algo"
description = "Set up a personal WireGuard VPN on DreamCompute"
version = "2.0.0-beta"
requires-python = ">=3.12"
dependencies = [
    "ansible==14.6.0",
    "cryptography>=50.0.2",
    "jinja2>=3.1.6",
    "netaddr==1.3.0",
    "openstacksdk>=4.22.0",
    "pyyaml>=6.0.3",
    "segno>=1.6.6",
]

[tool.setuptools]
# Explicitly disable package discovery since Algo is not a Python package
py-modules = []

[dependency-groups]
dev = [
    "yamllint>=1.38.0",
    "ansible-lint>=26.11.0",
]
