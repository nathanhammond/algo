---
- name: Gather facts
  setup:
- name: Install updates
  block:
    - name: Install software updates
      apt:
        update_cache: true
        install_recommends: true
        upgrade: dist
      register: result
      until: result is succeeded
      retries: 30
      delay: 10

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if updates need it
      shell: sleep 2 && shutdown -r now "Ansible updates triggered"
      async: 1
      poll: 0
      when: reboot_required.stat.exists
      changed_when: true
      failed_when: false

    - name: Wait until the server becomes ready...
      wait_for_connection:
        delay: 20
        timeout: 320
      when: reboot_required.stat.exists
      become: false

- name: Include unattended upgrades configuration
  import_tasks: unattended-upgrades.yml

- name: Ensure fallback resolvers are set
  ini_file:
    path: /etc/systemd/resolved.conf
    section: Resolve
    option: FallbackDNS
    value: "{{ dns_servers.ipv4 | join(' ') }}"
    mode: '0644'
  notify:
    - restart systemd-resolved

# The systemd-networkd file for the default interface (netplan generates it on
# Ubuntu servers). The dns role adds a drop-in for it; empty when networkd does
# not manage the interface.
- name: Find the default interface's network file
  command: networkctl status --no-pager {{ ansible_facts['default_ipv4']['interface'] }}
  register: _networkctl_status
  changed_when: false
  failed_when: false

- name: Remember the default interface's network file
  set_fact:
    default_network_file: >-
      {{ _networkctl_status.stdout | default('') | regex_findall('Network File: (/[-./@:A-Za-z0-9_]+)') | first | default('') }}

# The dns role sends the server's own lookups to dnscrypt-proxy; without
# dns_encryption they go to the DNS servers the network provides
- name: The server's own lookups skip dnscrypt-proxy when it is off
  file:
    path: /etc/systemd/resolved.conf.d/90-algo-dnscrypt.conf
    state: absent
  when: not dns_encryption | bool
  notify:
    - restart systemd-resolved

- name: The network's DNS servers are used again when dnscrypt-proxy is off
  file:
    path: /etc/systemd/network/{{ default_network_file | basename }}.d/90-algo-dns.conf
    state: absent
  when:
    - not dns_encryption | bool
    - default_network_file | length > 0
  notify:
    - restart systemd-networkd

- name: Loopback for services configured
  template:
    src: 10-algo-lo100.network.j2
    dest: /etc/systemd/network/10-algo-lo100.network
    mode: '0644'
  notify:
    - restart systemd-networkd

- name: systemd services enabled and started
  systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - systemd-networkd
    - systemd-resolved

- meta: flush_handlers

- name: Check apparmor support
  command: apparmor_status
  failed_when: false
  changed_when: false
  register: apparmor_status

- name: Set fact if apparmor enabled
  set_fact:
    apparmor_enabled: true
  when: '"profiles are in enforce mode" in apparmor_status.stdout'

- name: Gather additional facts
  import_tasks: facts.yml

- name: Set OS specific facts
  set_fact:
    tools:
      - apparmor-utils
      - iptables
      - iptables-persistent
      - cron
    # Strict reverse-path filtering drops packets whose source address would not be
    # routed back out the interface they arrived on, such as VPN addresses spoofed
    # from outside. Linux uses the larger of the "all" and per-interface values,
    # and Ubuntu sets both to 2 (loose), so set all, default and the public one.
    sysctl: >-
      {{ [{'item': 'net.ipv4.ip_forward', 'value': 1},
          {'item': 'net.ipv4.conf.all.forwarding', 'value': 1},
          {'item': 'net.ipv4.conf.all.route_localnet', 'value': 1},
          {'item': 'net.ipv4.conf.all.rp_filter', 'value': 1},
          {'item': 'net.ipv4.conf.default.rp_filter', 'value': 1},
          {'item': 'net.ipv4.conf.' + ansible_facts['default_ipv4']['interface'] + '.rp_filter', 'value': 1}]
         + ([{'item': 'net.ipv6.conf.all.forwarding', 'value': 1}] if ipv6_support | bool else []) }}

- name: Install packages
  include_tasks: packages.yml

- name: Install iptables packages
  apt:
    name:
      - iptables
      - iptables-persistent
    state: present
    update_cache: true
  tags: iptables

# Ubuntu's default backend. iptables-save/restore follow these alternatives.
- name: Use the nftables backend for iptables
  alternatives:
    name: "{{ item }}"
    path: "/usr/sbin/{{ item }}-nft"
  loop:
    - iptables
    - ip6tables
  tags: iptables

- include_tasks: iptables.yml
  tags: iptables
