---
- name: Set IPv6 support as a fact
  set_fact:
    ipv6_support: "{{ ansible_facts['default_ipv6']['gateway'] is defined }}"
  tags: always

- name: Check size of MTU
  set_fact:
    reduce_mtu: >-
      {{ 1500 - ansible_facts['default_ipv4']['mtu'] | int
         if reduce_mtu | int == 0 and ansible_facts['default_ipv4']['mtu'] | int < 1500
         else reduce_mtu | int }}
  tags: always
