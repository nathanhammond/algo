---
wireguard_PersistentKeepalive: 25
wireguard_config_path: configs/{{ IP_subject_alt_name }}/wireguard
wireguard_shared_pki: ""
# Keys and the user list: shared by every server (configs/<wireguard_shared_pki>), or
# this server's own
wireguard_pki_path: >-
  {{ ('configs/' + wireguard_shared_pki + '/wireguard/.pki') if wireguard_shared_pki | length > 0
     else (wireguard_config_path + '/.pki') }}
# The name of the server's own key pair in wireguard_pki_path. Shared keys use one name
# for every server, which no user can have (user names start with a letter or digit).
wireguard_server_key: "{{ '_server' if wireguard_shared_pki | length > 0 else IP_subject_alt_name }}"
wireguard_interface: wg0
wireguard_port_avoid: 53
wireguard_port_actual: 51820
keys_clean_all: false
wireguard_dns_servers: >-
  {%- if dns_encryption | bool -%}
  {{ local_service_ip }}{{ ', ' + local_service_ipv6 if ipv6_support | bool else '' }}{%-
  else -%}
  {%- for host in dns_servers.ipv4 -%}{{ host }}{% if not loop.last %},{% endif %}{%- endfor -%}
  {%- if ipv6_support | bool -%},{%- for host in dns_servers.ipv6 -%}{{ host }}{% if not loop.last %},{% endif %}{%- endfor -%}
  {%- endif -%}
  {%- endif -%}
wireguard_client_ip: >-
  {{ wireguard_network_ipv4 | ansible.utils.ipmath(index | int + 2) }}
  {{ ',' + wireguard_network_ipv6 | ansible.utils.ipmath(index | int + 2) if ipv6_support | bool else '' }}
wireguard_server_ip: >-
  {{ wireguard_network_ipv4 | ansible.utils.ipaddr('1') }}
  {{ ',' + wireguard_network_ipv6 | ansible.utils.ipaddr('1') if ipv6_support | bool else '' }}
