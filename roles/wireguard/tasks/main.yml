---
- name: Include tasks for Ubuntu
  include_tasks: ubuntu.yml
  tags: always


- name: Generate keys
  import_tasks: keys.yml
  delegate_to: localhost
  become: false
  tags: update-users

- tags: update-users
  block:
    - become: false
      delegate_to: localhost
      block:
        - name: WireGuard user list updated
          lineinfile:
            dest: "{{ wireguard_pki_path }}/index.txt"
            create: true
            mode: "0600"
            insertafter: EOF
            line: "{{ item }}"
          register: lineinfile
          loop: "{{ users }}"

        - set_fact:
            wireguard_users: "{{ (lookup('file', wireguard_pki_path + '/index.txt')).split('\n') }}"

        # diff: false keeps private keys out of --diff output
        - name: WireGuard users config generated
          template:
            src: client.conf.j2
            dest: "{{ wireguard_config_path }}/{{ item }}.conf"
            mode: "0600"
          diff: false
          loop: "{{ wireguard_users }}"
          loop_control:
            index_var: index
          when: item in users

        - name: Generate QR codes
          shell: >
            umask 077;
            which segno &&
            segno --scale=5 --output={{ item }}.png \
              "{{ lookup('template', 'client.conf.j2') }}" || true
          changed_when: false
          loop: "{{ wireguard_users }}"
          loop_control:
            index_var: index
          when: item in users
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          args:
            chdir: "{{ wireguard_config_path }}"
            executable: bash
          no_log: true

    - name: WireGuard configured
      template:
        src: server.conf.j2
        dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
        mode: "0600"
      diff: false
      notify: restart wireguard

- name: Look up the endpoint hostname
  command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "import socket, sys; print(' '.join(sorted({a[4][0] for a in socket.getaddrinfo(sys.argv[1], None, socket.AF_INET)})))"
      - "{{ endpoint_hostname }}"
  register: _endpoint_lookup
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  when:
    - endpoint_hostname | default('') | length > 0
    - cloudflare_api_token | default('') | length == 0

# Clients use the hostname, so say where it points; changing the DNS record is up to the user.
- name: Report where the endpoint hostname points
  debug:
    msg: >-
      {{ endpoint_hostname }}
      {{ 'does not resolve yet. Create a DNS A record for it pointing to ' + IP_subject_alt_name + '.'
         if _endpoint_lookup.rc != 0 else
         'points to this server.' if IP_subject_alt_name in _endpoint_lookup.stdout.split() else
         'points to ' + _endpoint_lookup.stdout + ', not this server. Clients connect there until its A record is changed to '
         + IP_subject_alt_name + '.' }}
  when:
    - endpoint_hostname | default('') | length > 0
    - cloudflare_api_token | default('') | length == 0

# daemon_reload: the hardening drop-in may have just changed, and its handler
# only runs at the flush below, after this start.
- name: WireGuard enabled and started
  systemd:
    name: "{{ service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- meta: flush_handlers
