---
- name: Ensure the WireGuard pki directory does not exist
  file:
    dest: "{{ wireguard_pki_path }}"
    state: absent
  when: keys_clean_all | bool

- name: Ensure the WireGuard pki directories exist
  file:
    dest: "{{ wireguard_pki_path }}/{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - preshared
    - private
    - public

# Existing keys are never replaced. The private key is written last, so a run
# interrupted part-way through regenerates that user's keys in full.
- name: Generate keys with the WireGuard tools
  shell: |
    set -euo pipefail
    umask 077
    key=$(wg genkey)
    printf '%s\n' "$key" | wg pubkey > public/{{ item | quote }}
    wg genpsk > preshared/{{ item | quote }}
    printf '%s\n' "$key" > private/{{ item | quote }}
  args:
    chdir: "{{ wireguard_pki_path }}"
    executable: /bin/bash
    # Relative to chdir: the shell module checks creates after changing directory
    creates: private/{{ item }}
  loop: "{{ users + [IP_subject_alt_name] }}"

- name: Set permissions for public keys
  file:
    path: "{{ wireguard_pki_path }}/public/{{ item }}"
    mode: '0644'
  loop: "{{ users + [IP_subject_alt_name] }}"

# Keys from earlier versions (which set the whole tree to 0700) or copied from
# elsewhere may have other modes; the directories stay 0700 either way.
- name: Set permissions for private and preshared keys
  file:
    path: "{{ wireguard_pki_path }}/{{ item.1 }}/{{ item.0 }}"
    mode: '0600'
  loop: "{{ (users + [IP_subject_alt_name]) | product(['private', 'preshared']) | list }}"
  loop_control:
    label: "{{ item.1 }}/{{ item.0 }}"
