---
- name: daemon-reload
  systemd:
    daemon_reload: true

- name: restart dnscrypt-proxy.socket
  systemd:
    name: dnscrypt-proxy.socket
    state: restarted
    daemon_reload: true

- name: restart dnscrypt-proxy
  systemd:
    name: dnscrypt-proxy
    state: restarted
    daemon_reload: true

- name: restart dnscrypt-proxy-adblock.socket
  systemd:
    name: dnscrypt-proxy-adblock.socket
    state: restarted
    daemon_reload: true

- name: restart dnscrypt-proxy-adblock
  systemd:
    name: dnscrypt-proxy-adblock
    state: restarted
    daemon_reload: true
