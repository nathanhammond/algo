---
- fail:
    msg: >-
      OpenStack credentials are not set. Download it from the OpenStack dashboard->Compute->API Access
      and source it in the shell (eg: source /tmp/dhc-openrc.sh)
  when: lookup('env', 'OS_AUTH_URL')|length <= 0

- name: Security group created
  openstack.cloud.security_group:
    state: "{{ state | default('present') }}"
    name: "{{ algo_server_name }}-security_group"
    description: AlgoVPN security group
  register: os_security_group

- name: Security rules created
  openstack.cloud.security_group_rule:
    state: "{{ state | default('present') }}"
    security_group: "{{ os_security_group.security_group.id }}"
    protocol: "{{ item.proto }}"
    port_range_min: "{{ item.port_min }}"
    port_range_max: "{{ item.port_max }}"
    remote_ip_prefix: "{{ item.range }}"
  loop:
    - { proto: tcp, port_min: "{{ ssh_port }}", port_max: "{{ ssh_port }}", range: 0.0.0.0/0 }
    - { proto: icmp, port_min: -1, port_max: -1, range: 0.0.0.0/0 }
    - { proto: udp, port_min: "{{ wireguard_port }}", port_max: "{{ wireguard_port }}", range: 0.0.0.0/0 }

- name: Gather facts about flavors
  openstack.cloud.compute_flavor_info:
    ram: "{{ cloud_providers.openstack.flavor_ram }}"
  register: os_flavor

- name: Gather facts about images
  openstack.cloud.image_info:
    image: "{{ cloud_providers.openstack.image }}"
  register: os_image

- name: Gather facts about public networks
  openstack.cloud.networks_info:
  register: os_network

# openstack.cloud 2.x returns openstacksdk resources: flavors/images/networks
# lists with attribute names such as is_router_external.
- name: Set facts
  set_fact:
    flavor_id: "{{ (os_flavor.flavors | sort(attribute='ram') | first | default({})).id | default(none) }}"
    image_id: "{{ (os_image.images | selectattr('status', '==', 'active') | first | default({})).id | default(none) }}"
    public_network: >-
      {{ os_network.networks | selectattr('is_router_external') | selectattr('is_admin_state_up')
         | selectattr('status', '==', 'ACTIVE') | first | default(none) }}

- name: Verify a flavor matched
  assert:
    that: flavor_id is not none
    msg: "No flavor has RAM {{ cloud_providers.openstack.flavor_ram }}. Change cloud_providers.openstack.flavor_ram in config.cfg."

- name: Verify the image exists
  assert:
    that: image_id is not none
    msg: "No active image is named {{ cloud_providers.openstack.image }}. List images with: openstack image list"

- name: Verify a public network exists
  assert:
    that: public_network is not none
    msg: No active external network was found in this OpenStack project.

# Used to decide whether endpoint_hostname may be pointed at this server
- name: Look up the project's servers
  openstack.cloud.server_info:
  register: os_all_servers

- name: Remember the project's server addresses
  set_fact:
    project_server_ips: >-
      {{ os_all_servers.servers | map(attribute='addresses') | map('dict2items') | flatten
         | map(attribute='value') | flatten | selectattr('version', '==', 4) | map(attribute='addr') | list }}

- name: Look up an existing server
  openstack.cloud.server_info:
    name: "{{ algo_server_name }}"
  register: os_existing_server

# DreamCompute's Nova predates API microversion 2.52 and rejects the tags field.
# openstack.cloud.server always sends tags (it rejects null and defaults to []),
# so create the server through openstacksdk directly; resource sends only the
# attributes listed here. Existing servers are found above and left as they are.
- name: Server created
  openstack.cloud.resource:
    service: compute
    type: server
    attributes:
      name: "{{ algo_server_name }}"
      image_id: "{{ image_id }}"
      flavor_id: "{{ flavor_id }}"
      security_groups:
        - name: "{{ os_security_group.security_group.name }}"
      user_data: "{{ lookup('template', 'files/cloud-init/base.yml') | b64encode }}"
      # DreamCompute attaches servers directly to the public network
      networks:
        - uuid: "{{ public_network.id }}"
    wait: true
  register: os_server
  when: os_existing_server.servers | length == 0
  # The response includes the server's generated admin password
  no_log: true

- set_fact:
    cloud_instance_ip: >-
      {{ (os_existing_server.servers[0] if os_server is skipped else os_server.resource).addresses[public_network.name]
         | selectattr('version', '==', 4) | map(attribute='addr') | first }}
    ansible_ssh_user: algo
    ansible_ssh_port: "{{ ssh_port }}"
    cloudinit: true

- name: Save the new server's SSH host key
  when: os_server is not skipped
  block:
    # cloud-init writes the key to the console once it has installed updates,
    # about 285 s after the server is created
    - name: Wait for the server to write its SSH host key
      pause:
        seconds: 200

    - name: Read the SSH host key from the server's console log
      command: "{{ ansible_playbook_python }} -I {{ role_path }}/files/console_host_key.py {{ os_server.resource.id }}"
      register: _console_host_key
      # 1 means not written yet; 0 found it, 2 found something wrong
      until: _console_host_key.rc != 1
      retries: 70
      delay: 10
      changed_when: false
      failed_when: _console_host_key.rc != 0

    - name: Ensure the config directory exists
      file:
        path: configs/{{ cloud_instance_ip }}
        state: directory
        mode: "0700"

    # Replaces any key saved for a destroyed server that had the same address
    - name: Save the host key to known_hosts
      copy:
        content: "{{ ('[' + cloud_instance_ip + ']:' + ssh_port | string) if ssh_port | int != 22 else cloud_instance_ip }} {{ _console_host_key.stdout }}\n"
        dest: configs/{{ cloud_instance_ip }}/known_hosts
        mode: "0600"
