---

# This is the list of users to generate.
# Every device must have a unique user.
# You can add up to 65,534 new users over the lifetime of an AlgoVPN.
# User names with leading 0's or containing only numbers should be escaped in double quotes, e.g. "000dan" or "123".
# Email addresses are not allowed.
users:
  - phone
  - laptop
  - desktop

### Review these options BEFORE you run Algo, as they are very difficult/impossible to change after the server is deployed.

# SSH port for cloud deployments (doesn't apply to existing Ubuntu servers)
ssh_port: 4160

wireguard_port: 51820  # Change if blocked by your network (avoid 53/UDP)

# Hostname that WireGuard clients connect to instead of the server's IP address,
# e.g. vpn.example.com. Point its DNS A record at the server that should carry
# the VPN; switching servers is then a DNS change. Empty uses the server's IP.
endpoint_hostname: ""

# Cloudflare API token (Zone:Read and DNS:Edit for the hostname's zone), read from
# the environment. When set, the hostname's A record is created or updated.
cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"

# Reduce MTU if connections hang (0 = auto-detect)
# See: docs/troubleshooting.md#various-websites-appear-to-be-offline-through-the-vpn
reduce_mtu: 0

# Encrypted DNS through dnscrypt-proxy on the server. When false, clients use
# dns_servers below directly.
dns_encryption: true

# Answer every plain DNS query (port 53) VPN clients send with dnscrypt-proxy,
# whichever resolver it was addressed to, so none leaves the server unencrypted.
# Needs dns_encryption. DNS over TLS or HTTPS that a device chooses itself is
# already encrypted and is not affected.
dns_force_dnscrypt: true

# Client isolation (set false for "road warrior" setup where clients can reach each other)
BetweenClients_DROP: true
block_smb: true          # Block SMB/CIFS traffic
block_netbios: true      # Block NETBIOS traffic

# Reboot after updates that need it (such as a new kernel), so security fixes take
# effect. The time is in the server's timezone, which is UTC on DreamCompute.
# VPN connections drop for about a minute.
unattended_reboot:
  enabled: true
  time: "21:00"

### Privacy Settings ###
# Master switch for privacy enhancements (log rotation, history clearing, etc.)
# Set to false for debugging. For advanced privacy options, see roles/privacy/defaults/main.yml
privacy_enhancements_enabled: true

### Advanced users only below this line ###

# DNSCrypt providers (see https://github.com/DNSCrypt/dnscrypt-resolvers/blob/master/v2/public-resolvers.md)
dnscrypt_servers:
  ipv4:
    - cloudflare
#   - google
#   - YourCustomServer  # For NextDNS etc., add stamp below
  ipv6:
    - cloudflare-ipv6

custom_server_stamps:
# YourCustomServer: 'sdns://...'

# Extra DNS records answered by the VPN's resolver, as name: IP address.
# Only the exact name matches, not its subdomains.
dns_records: {}
# dns_records:
#   nas.example.com: 192.168.1.10

# DNS servers clients use when dns_encryption is false. When it is true, dnscrypt-proxy
# uses them only at startup, to download its resolver list and look up server names.
dns_servers:
  ipv4:
    - 1.1.1.1
    - 1.0.0.1
  ipv6:
    - 2606:4700:4700::1111
    - 2606:4700:4700::1001

# Regenerate ALL user credentials on update-users (not just new users)
# When false: existing WireGuard keys are preserved, new users added
# When true: all credentials deleted and regenerated - ALL CLIENTS MUST RECONFIGURE
# Use true after: suspected key compromise, removing untrusted users, or security audit
keys_clean_all: false

### VPN Network Configuration ###
wireguard_network_ipv4: 10.49.0.0/16
wireguard_network_ipv6: 2001:db8:a160::/48

# Seconds between keepalive packets from each client (0 = none). Without them, the first
# request after 3 idle minutes waits for a new handshake (about one round trip), and
# clients behind NAT stop receiving traffic once the NAT forgets them. Costs one small
# packet every 25 s per device, a little battery on phones.
wireguard_PersistentKeepalive: 25

# Randomly generated IP address for the local dns resolver
local_service_ip: "{{ '172.16.0.1' | ansible.utils.ipmath(1048573 | random(seed=algo_server_name + ansible_facts['fqdn'])) }}"
local_service_ipv6: "{{ 'fd00::1' | ansible.utils.ipmath(1048573 | random(seed=algo_server_name + ansible_facts['fqdn'])) }}"


congrats:
  common: |
    "#                          Congratulations!                            #"
    "#                     Your Algo server is running.                     #"
    "#          Client configs are in the ./configs/ directory.             #"
    "#              Go to https://whoer.net/ after connecting               #"
    "#        and ensure that all your traffic passes through the VPN.      #"
    "#                     Local DNS resolver {{ local_service_ip }}{{ ', ' + local_service_ipv6 if ipv6_support else '' }}                   #"

SSH_keys:
  comment: algo@ssh
  private: configs/algo.pem
  public: configs/algo.pem.pub

cloud_providers:
  openstack:
    flavor_ram: ">=512"
    # DreamCompute has no public Ubuntu 26.04 image; this is a private image made
    # from Canonical's cloud image (see README). Ubuntu-24.04 also works.
    image: Ubuntu-26.04-cloudimg

fail_hint:
  - Sorry, but something went wrong!
  - Check troubleshooting for common fixes, or file an issue if you found a bug.
  - https://trailofbits.github.io/algo/troubleshooting.html
  - https://github.com/trailofbits/algo/issues/new

